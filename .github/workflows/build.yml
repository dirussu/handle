name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build (Debug, unsigned)
        run: |
          xcodebuild -project Handle.xcodeproj -scheme Handle -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build \
            | grep -E "error:|warning: .*Handle/|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0
      - name: Test
        run: |
          xcodebuild test -project Handle.xcodeproj -scheme Handle \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | grep -E "error:|Test Case .* failed|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)" || true
          test "${PIPESTATUS[0]}" -eq 0
      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project Handle.xcodeproj -scheme Handle -configuration Release \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build \
            | grep -E "error:|warning: .*Handle/|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0
